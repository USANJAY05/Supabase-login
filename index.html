<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Strength Log</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f7;color:#17202a;padding:20px;box-sizing:border-box}.card{width:min(100%,400px);background:white;padding:26px;border-radius:16px;box-shadow:0 10px 30px #0001;box-sizing:border-box}input,button{width:100%;padding:13px;margin-top:10px;border-radius:9px;box-sizing:border-box;font:inherit}input{border:1px solid #cbd2da}button{border:0;background:#17202a;color:white;cursor:pointer;font-weight:600}button.alt{background:#e9edf1;color:#17202a}#msg{margin-top:14px;line-height:1.5;overflow-wrap:anywhere}.hint{color:#647080;font-size:14px}</style></head><body><main class="card"><h1>Home Strength Log</h1><p class="hint">Create your account or sign in.</p><form id="f"><input id="email" type="email" autocomplete="email" placeholder="Email address" required><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Password (minimum 6 characters)" required><button type="submit">Create account</button></form><button id="login" class="alt" type="button">Sign in</button><button id="reset" class="alt" type="button">Forgot password</button><div id="msg" role="status" aria-live="polite"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const msg=document.getElementById('msg'),form=document.getElementById('f'),email=document.getElementById('email'),password=document.getElementById('password'),login=document.getElementById('login'),reset=document.getElementById('reset');let sb;function say(s){msg.textContent=s}function get(){return{email:email.value.trim(),password:password.value}}function busy(v){form.querySelector('button').disabled=v;login.disabled=v;reset.disabled=v}window.addEventListener('load',()=>{if(!window.supabase){say('Could not load the sign-in library. Check your internet connection and reload.');return}sb=window.supabase.createClient('https://kakhpmdoafnohpmjgtks.supabase.co','sb_publishable_iAwUrr9Cr4fqlhRue-y20A_WfVtaevE')});form.addEventListener('submit',async e=>{e.preventDefault();if(!sb)return say('Sign-in library not ready. Reload and try again.');const v=get();busy(true);say('Creating account…');try{const {data,error}=await sb.auth.signUp(v);say(error?error.message:(data.session?'Account created and signed in.':'Sign-up requested. Check your email if confirmation is required.'))}catch(e){say(e.message||'Request failed. Check your internet connection.')}finally{busy(false)}});login.addEventListener('click',async()=>{if(!sb)return say('Sign-in library not ready. Reload and try again.');const v=get();if(!v.email||!v.password)return say('Enter your email and password first.');busy(true);say('Signing in…');try{const {error}=await sb.auth.signInWithPassword(v);say(error?error.message:'Signed in successfully.')}catch(e){say(e.message||'Request failed.')}finally{busy(false)}});reset.addEventListener('click',async()=>{if(!sb)return say('Sign-in library not ready. Reload and try again.');if(!email.value.trim())return say('Enter your email address first.');busy(true);say('Requesting reset email…');try{const {error}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.href});say(error?error.message:'If the account exists, a password reset email will be sent.')}catch(e){say(e.message||'Request failed.')}finally{busy(false)}})})();</script></body></html>
